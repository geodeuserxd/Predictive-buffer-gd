
name: Build Android Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Android64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Buffer-Android64
          path: ${{ steps.build.outputs.build-output }}
          
